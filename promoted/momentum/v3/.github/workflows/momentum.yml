name: momentum v3
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Date to price (YYYY-MM-DD); default today"
        required: false
jobs:
  price:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promoted/momentum/v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Put your data sync here: the job expects ./data/<input>.csv for every
      # declared input. The contracts in research2prod.toml say what each file must hold.
      - run: python run.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }}
        env:
          RESEARCH2PROD_SINK_TOKEN: ${{ secrets.RESEARCH2PROD_SINK_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-signals
          path: promoted/momentum/v3/signals/
