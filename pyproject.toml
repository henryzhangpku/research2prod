[project]
name = "research2prod"
version = "0.2.0"
description = "Guided self-service from quant research to production. Write the signal once; it is already production code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Henry Zhang" }]
keywords = ["quantitative-research", "signals", "backtesting", "point-in-time", "mlops", "research-to-production"]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
research2prod = "research2prod.cli:app"

[project.urls]
Homepage = "https://github.com/henryzhangpku/research2prod"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research2prod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
