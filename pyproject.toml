[project]
name = "asof"
version = "0.1.0"
description = "Promote a research model to a production job without an engineer in the loop"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
asof = "asof.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asof"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ARG", "SIM", "C4"]
ignore = [
    # Typer's whole interface is Option()/Argument() in defaults.
    "B008",
    # Long lines are almost always prose in a docstring or a table.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Example models take a ctx they may not use every branch of.
"examples/*" = ["ARG001"]
# Fixtures legitimately take arguments they only forward.
"tests/*" = ["ARG001", "ARG005"]
